- type: entity
  parent: [BaseWeaponBatterySmall, BaseBlueShieldContraband]
  id: PistolBlueShield
  name: лазерный пистолет "Синего щита"
  description: Пистолет, разработанный специально для офицеров, в задачи которых входит защита командного состава.
  components:
  - type: Sprite
    sprite: _DeadSpace/Objects/Weapons/Guns/Battery/blueshield_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 1.4
    soundGunshot:
      path: /Audio/_DeadSpace/Weapons/Guns/Gunshots/laser_shot.ogg
      params:
        volume: -2
  - type: Clothing
    sprite: _DeadSpace/Objects/Weapons/Guns/Battery/blueshield_gun.rsi
  - type: BatteryAmmoProvider
    proto: VioletLaser
    fireCost: 75
  - type: Appearance
  - type: BatterySelfRecharger
    autoRechargeRate: 7.5
  - type: Battery
    maxCharge: 1125
    startingCharge: 1125
  - type: Tag
    tags:
    - Sidearm
    - LaserWeapon
  - type: StaticPrice
    price: 750

- type: entity
  parent: BasicHitscan
  id: VioletLaser
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 20
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _DeadSpace/Objects/Weapons/Guns/Projectiles/violethit.rsi
      state: muzzle_beam_violet
    travelFlash:
      sprite: _DeadSpace/Objects/Weapons/Guns/Projectiles/violethit.rsi
      state: beam_violet
    impactFlash:
      sprite: _DeadSpace/Objects/Weapons/Guns/Projectiles/violethit.rsi
      state: impact_beam_violet
